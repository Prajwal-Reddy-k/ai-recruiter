server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — react-router handles client-side routes, so any path that isn't a real
    # static file falls back to index.html rather than a nginx 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
