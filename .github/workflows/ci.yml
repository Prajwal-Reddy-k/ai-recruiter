name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  build-test-e2e:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "P@ssw0rd_CI_Only!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'P@ssw0rd_CI_Only!' -Q 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      ASPNETCORE_ENVIRONMENT: Testing
      ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=AIRecruiterTestDb;User Id=sa;Password=P@ssw0rd_CI_Only!;TrustServerCertificate=True;"
      Jwt__Secret: "ci-only-secret-key-at-least-32-characters-long-for-tests"
      VITE_API_BASE_URL: "http://localhost:5199/api"

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore backend
        run: |
          dotnet restore src/AIRecruiter.API/AIRecruiter.API.csproj
          dotnet restore tests/AIRecruiter.UnitTests/AIRecruiter.UnitTests.csproj

      - name: Build backend
        run: |
          dotnet build src/AIRecruiter.API/AIRecruiter.API.csproj --no-restore --configuration Release
          dotnet build tests/AIRecruiter.UnitTests/AIRecruiter.UnitTests.csproj --no-restore --configuration Release

      - name: Run xUnit tests
        run: dotnet test tests/AIRecruiter.UnitTests/AIRecruiter.UnitTests.csproj --no-build --configuration Release --logger "trx;LogFileName=unit-tests.trx"

      - name: Upload xUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: tests/AIRecruiter.UnitTests/TestResults/*.trx

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start backend (Testing environment)
        run: |
          nohup dotnet run --project src/AIRecruiter.API --no-launch-profile --urls http://localhost:5199 --configuration Release > backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5199/health > /dev/null; then
              echo "Backend is up."
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to start within timeout."
          cat backend.log
          exit 1

      - name: Start frontend (preview server, built with VITE_API_BASE_URL above)
        working-directory: frontend
        run: |
          nohup npm run preview -- --port 4173 --strictPort > frontend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4173 > /dev/null; then
              echo "Frontend is up."
              exit 0
            fi
            sleep 2
          done
          echo "Frontend failed to start within timeout."
          cat frontend.log
          exit 1

      - name: Run Playwright E2E suite
        working-directory: frontend
        env:
          E2E_SKIP_WEBSERVER: "1"
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload backend log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: backend.log
